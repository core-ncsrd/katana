# OSM authentication retry is automatic in Katana; no retry field is required.
base_slice_descriptor:
  base_slice_des_id: frontend_openstack_retry_test_01
  coverage:
    - core3rdtest
  delay_tolerance: true
  network_DL_throughput:
    guaranteed: 1500000
  ue_DL_throughput:
    guaranteed: 1500000
  network_UL_throughput:
    guaranteed: 50000
  ue_UL_throughput:
    guaranteed: 60000
  mtu: 1500

service_descriptor:
  ns_list:
    - nsd-id: 5c17d35a-0cd3-42a3-95c6-4dec4c27f906
      ns-name: hackfest-basic-frontend-retry-test-01
      nfvo-id: osm-main
      target: core-openstack
      placement: core
      optional: false
